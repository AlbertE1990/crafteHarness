name: Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    strategy:
      matrix:
        node_version: [lts/*]
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - name: Set node version to ${{ matrix.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - name: Install
        run: pnpm i

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # 库产物是发布内容，因此先构建再测试与冒烟，确保被验证的就是将要发布的形状。
      - name: Build library
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Pack smoke test
        run: pnpm run smoke:pack

      - name: Build sample
        run: pnpm run build:sample
